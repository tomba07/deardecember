name: dear-december
services:
  dear-december:
    image: ${DEAR_DECEMBER_IMAGE:-dear-december:latest}
    container_name: dear-december
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - dear_december_data:/data
    expose:
      - "3000"
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{headers:{host:new URL(process.env.BETTER_AUTH_URL).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  dear_december_data:
    name: dear_december_data
networks:
  web:
    external: true
    name: web
